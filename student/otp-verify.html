<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verify OTP | CITE Secure Feedback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at top, #3a3a3a 0, #121212 55%, #000 100%);
      color: #f5f5f5; overflow: hidden;
    }

    .verify-card {
      width: 100%; max-width: 440px; padding: 50px 30px;
      background: rgba(18, 18, 18, 0.98); border-radius: 24px; border: 1px solid #333;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8); text-align: center;
    }

    .school-title {
      font-size: 0.75rem; color: #888; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px;
    }

    h2 { font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; }

    .msg { font-size: 0.9rem; color: #666; margin-bottom: 35px; line-height: 1.5; }

    .otp-container {
      display: flex; justify-content: center; gap: 8px; margin-bottom: 35px; width: 100%;
    }

    .otp-input {
      width: 50px; height: 60px; border-radius: 12px; border: 1px solid #333;
      background: #080808; color: #fff; font-size: 1.5rem; font-weight: 700;
      text-align: center; outline: none; transition: all 0.2s ease;
    }


    .otp-input::-webkit-outer-spin-button,
    .otp-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    .otp-input:focus { border-color: #f5f5f5; background: #0c0c0c; }

    .btn-verify {
      width: 100%; padding: 18px; border-radius: 12px; border: none;
      background: #f5f5f5; color: #000; font-weight: 800;
      text-transform: uppercase; font-size: 0.9rem; cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-verify:hover { background: #ffffff; transform: translateY(-2px); }

    .resend-link {
      display: block; margin-top: 30px; font-size: 0.85rem; color: #555;
      text-decoration: none; transition: 0.2s;
    }

    .resend-link:hover { color: #f5f5f5; }
  </style>
</head>
<body>

  <main class="verify-card">
    <h2>Verify Identity</h2>
    <p class="msg">We sent a 6-digit code to your email.</p>

    <form onsubmit="event.preventDefault(); window.location.href='student.html';">
      <div class="otp-container">
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'');" required>
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'');" required>
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'');" required>
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'');" required>
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'');" required>
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'');" required>
      </div>

      <button type="submit" class="btn-verify">Submit</button>
    </form>

    <a href="#" class="resend-link">Didn't receive a code? Resend</a>
  </main>

  <script>
    const inputs = document.querySelectorAll('.otp-input');
    
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (input.value && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === "Backspace") {
          if (!input.value && index > 0) {
            inputs[index - 1].focus();
          }
        }
      });
    });
  </script>

</body>
</html>
