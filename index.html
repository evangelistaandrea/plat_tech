<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CITE Secure Feedback | PHINMA UPang</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at top, #3a3a3a 0, #121212 55%, #000 100%);
      color: #f5f5f5; overflow: hidden;
    }
    .main-card {
      width: 100%; max-width: 550px; padding: 48px 32px; text-align: center;
      background: rgba(18, 18, 18, 0.98); border-radius: 24px; border: 1px solid #333;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
    }
    .logo-container { margin-bottom: 24px; }
    .logo-img { height: 110px; width: auto; filter: drop-shadow(0 0 10px rgba(255,255,255,0.1)); }
    
    .school-label { 
      display: inline-block; padding: 6px 14px; border-radius: 999px; 
      background: rgba(255, 255, 255, 0.05); border: 1px solid #444; color: #f5f5f5;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 12px;
    }

    .dept-title {
      font-size: 0.9rem;
      color: #888;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .system-title { 
      font-size: 2.4rem; 
      font-weight: 800; 
      letter-spacing: -1.5px; 
      line-height: 1.1; 
      margin-bottom: 16px;
    }
    
    .system-subtitle { font-size: 0.95rem; color: #666; margin-bottom: 40px; line-height: 1.5; }
    
    .btn-stack { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 320px; margin: 0 auto; }
    .btn {
      padding: 16px; border-radius: 12px; font-weight: 700; text-transform: uppercase;
      text-decoration: none; font-size: 0.9rem; transition: all 0.2s ease; cursor: pointer;
      display: block;
    }
    .btn-student { background: #f5f5f5; color: #111; border: none; }
    .btn-admin { background: transparent; color: #f5f5f5; border: 1px solid #444; }
    
    .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); border-color: #f5f5f5; }
    
    .tech-badges {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 15px;
      font-size: 0.65rem;
      color: #444;
      font-weight: bold;
    }
    .dot { color: #555; margin-right: 4px; }
  </style>
</head>
<body>
  <main class="main-card">
    <div class="logo-container">
      <img src="logo.png" alt="PHINMA UPang Logo" class="logo-img" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';">
      <div id="logo-fallback" style="display:none; width:85px; height:85px; border:2px solid #f5f5f5; border-radius:50%; margin:0 auto; align-items:center; justify-content:center; background:radial-gradient(circle, #333, #000); color:#fff; font-weight:bold;">CITE</div>
    </div>

    <span class="school-label">College of Information Technology Education</span>
    <p class="dept-title">PHINMA - University of Pangasinan</p>
    
    <h1 class="system-title">Secure Student<br>Feedback Portal</h1>
    
    <p class="system-subtitle">
       Anonymized department portal protected by Blockchain &<br>
        monitored by RNN-LSTM AI for sequence-based anomaly detection.
    </p>
    
    <div class="btn-stack">
      <a href="student/student-login.html" class="btn btn-student">Student</a>
      <a href="admin/admin-login.html" class="btn btn-admin">Admin</a>
    </div>

  </main>
</body>
</html>
