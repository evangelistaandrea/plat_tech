<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login | CITE Secure Feedback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at top, #3a3a3a 0, #121212 55%, #000 100%);
      color: #f5f5f5; overflow: hidden;
    }

    .login-card {
      width: 100%; max-width: 440px; padding: 50px 40px;
      background: rgba(18, 18, 18, 0.98); border-radius: 20px; border: 1px solid #333;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8); text-align: center;
    }

    .logo-mini { height: 75px; margin-bottom: 24px; filter: drop-shadow(0 0 8px rgba(255,255,255,0.1)); }
    .school-title { font-size: 0.75rem; color: #888; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
    h2 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 40px; }

    .form-group { text-align: left; margin-bottom: 28px; }
    label { font-size: 0.75rem; font-weight: 700; color: #aaa; display: block; margin-bottom: 10px; text-transform: uppercase; }

    .password-container { position: relative; display: flex; align-items: center; }

    .input-field {
      width: 100%; padding: 16px 20px; border-radius: 12px; border: 1px solid #333;
      background: #080808; color: #fff; font-size: 1rem; outline: none;
      transition: all 0.2s ease; padding-right: 50px;
    }

    .input-field:focus { border-color: #f5f5f5; background: #0c0c0c; }

    .toggle-btn {
      position: absolute; right: 18px; width: 24px; height: 24px;
      background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    .eye-icon {
      position: relative; width: 18px; height: 12px;
      border: 2px solid #555; border-radius: 50% / 100% 100% 100% 100%;
      transition: 0.2s;
    }

    .eye-icon::after {
      content: ''; position: absolute; width: 4px; height: 4px;
      background: #555; border-radius: 50%;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      transition: 0.1s;
    }

    .toggle-btn::before {
      content: ''; position: absolute; width: 0; height: 2px;
      background: #888; transform: rotate(-45deg);
      transition: 0.2s; z-index: 1;
    }

    .toggle-btn.hidden .eye-icon { border-color: #333; }
    .toggle-btn.hidden .eye-icon::after { opacity: 0; }
    .toggle-btn.hidden::before { width: 22px; }

    .btn-admin {
      width: 100%; padding: 18px; border-radius: 12px; border: none;
      background: #f5f5f5; color: #000; font-weight: 800;
      text-transform: uppercase; font-size: 0.9rem; cursor: pointer;
      transition: 0.2s; margin-top: 10px;
    }

    .btn-admin:hover { background: #ffffff; transform: translateY(-2px); }
    .back-link { display: inline-block; margin-top: 30px; font-size: 0.85rem; color: #555; text-decoration: none; }
    .back-link:hover { color: #f5f5f5; }
  </style>
</head>
<body>

  <main class="login-card">
    <img src="logo.png" alt="CITE" class="logo-mini" onerror="this.style.opacity='0.5'">
    <p class="school-title">PHINMA - University of Pangasinan</p>
    <h2>Admin Login</h2>

    <form onsubmit="event.preventDefault(); window.location.href='admin.html';">
      <div class="form-group">
        <label for="admin-user">Faculty / Admin ID</label>
        <input type="text" id="admin-user" class="input-field" placeholder="Enter Admin ID" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-container">
          <input type="password" id="password" class="input-field" placeholder="••••••••" required>
          <button type="button" id="eye-btn" class="toggle-btn" onclick="toggleVisibility()">
            <div class="eye-icon"></div>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-admin">Access Dashboard</button>
    </form>

    <a href="../index.html" class="back-link">← Return to Portal</a>
  </main>

  <script>
    function toggleVisibility() {
      const passInput = document.getElementById("password");
      const eyeBtn = document.getElementById("eye-btn");
      
      if (passInput.type === "password") {
        passInput.type = "text";
        eyeBtn.classList.add("hidden");
      } else {
        passInput.type = "password";
        eyeBtn.classList.remove("hidden");
      }
    }
  </script>

</body>
</html>
